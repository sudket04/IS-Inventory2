<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Inventory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">SVR</span>
      <div>
        <div class="brand-title">IT Inventory</div>
        <div class="brand-sub">Infrastructure asset register</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-head">
        <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Toggle menu" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p class="muted" id="pageDesc">Live summary of the infrastructure inventory</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="addBtn" class="primary-btn">+ Add</button>
        <div class="user-menu" id="userChip" hidden>
          <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar" id="userAvatar"></span>
            <span class="user-menu-info">
              <span class="user-chip-name" id="userChipName"></span>
              <span class="user-chip-role" id="userChipRole"></span>
            </span>
            <svg class="user-menu-caret" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3l4 4 4-4"/></svg>
          </button>
          <div class="user-menu-panel" id="userMenuPanel" hidden>
            <button id="logoutBtn" class="user-menu-logout" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <section class="card" id="genericCard">
        <div class="filter-bar" id="filterBar" hidden></div>
        <div class="table-scroll">
          <table id="dataTable"></table>
        </div>
        <p class="empty-state" id="emptyState" hidden>No data yet. Click "+ Add" to get started.</p>
      </section>
      <div id="customView" hidden></div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
      <section class="panel" id="panel">
        <div class="panel-head">
          <h2 id="panelTitle">Add</h2>
          <button class="icon-btn" id="closePanelBtn" aria-label="Close form">×</button>
        </div>
        <form id="dataForm" novalidate>
          <div class="dialog-content">
            <p class="form-error" id="formError" hidden></p>
            <div id="panelBody"></div>
          </div>
          <div class="panel-actions">
            <button type="button" class="ghost-btn" id="cancelBtn">Cancel</button>
            <button type="submit" class="primary-btn">Save</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="historyModalBackdrop">
      <section class="panel" id="historyPanel" style="max-width:560px;">
        <div class="panel-head">
          <h2 id="historyPanelTitle">History</h2>
          <button class="icon-btn" id="closeHistoryPanelBtn" aria-label="Close history">×</button>
        </div>
        <div class="dialog-content">
          <div id="historyBody"></div>
        </div>
        <div class="panel-actions">
          <button type="button" class="ghost-btn" id="closeHistoryBtn2">Close</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="renewModalBackdrop">
      <section class="panel" id="renewPanel" style="max-width:480px;">
        <div class="panel-head">
          <h2 id="renewPanelTitle">Renew</h2>
          <button class="icon-btn" id="closeRenewPanelBtn" aria-label="Close">×</button>
        </div>
        <form id="renewForm" novalidate>
          <div class="dialog-content">
            <p class="form-error" id="renewFormError" hidden></p>
            <div class="field-grid">
              <label class="field">
                <span class="field-label">New expiry date <span class="req">*</span></span>
                <span class="control-slot">
                  <input type="hidden" id="renewExpiry">
                  <input type="text" id="renewExpiryDisplay" class="date-mask-input" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" autocomplete="off">
                </span>
              </label>
              <label class="field">
                <span class="field-label">Contract / Subscription No.</span>
                <span class="control-slot"><input type="text" id="renewContractNo"></span>
              </label>
              <label class="field">
                <span class="field-label">Provider / Vendor</span>
                <span class="control-slot"><input type="text" id="renewProvider"></span>
              </label>
              <label class="field">
                <span class="field-label">Cost (THB) <span class="req">*</span></span>
                <span class="control-slot"><input type="number" id="renewCost" min="0" step="0.01" required></span>
              </label>
              <label class="field full">
                <span class="field-label">Note</span>
                <span class="control-slot"><textarea id="renewNote" rows="2"></textarea></span>
              </label>
            </div>
            <div id="renewHistoryWrap"></div>
          </div>
          <div class="panel-actions">
            <button type="button" class="ghost-btn" id="renewCancelBtn">Cancel</button>
            <button type="submit" class="primary-btn">Renew</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>

<div class="boot-overlay" id="bootOverlay">
  <div class="boot-spinner"></div>
  <p>Loading inventory…</p>
</div>
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="login-brand">
      <span class="brand-mark">SVR</span>
      <div>
        <div class="login-brand-title">IT Inventory</div>
        <div class="login-brand-sub">Infrastructure asset register</div>
      </div>
    </div>
    <h1 class="login-title">Sign in</h1>
    <div class="login-field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </div>
    <p class="login-error" id="loginError" hidden></p>
    <button type="submit" class="primary-btn login-btn">Sign in</button>
    <p class="login-hint" id="loginHint"></p>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
